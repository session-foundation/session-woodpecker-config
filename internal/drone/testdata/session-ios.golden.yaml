        - git --version
        - xcbeautify --version
        - xcresultparser --version
        - xcodebuild -version
        - xcodebuild -showsdks
        - xcode-select -p
        - xcrun simctl list runtimes
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
        LANG: en_US.UTF-8
      image: sh
      name: Version Information
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - ./Scripts/reset_spm_cache.sh
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Reset SPM Cache if Needed
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - ./Scripts/clean_up_old_test_simulators.sh
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Clean up Old Test Simulators if Needed
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - devname="Test-iPhone-${CI_COMMIT_SHA:0:9}-${CI_PIPELINE_EVENT}"
        - sdk_version=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "")
        - runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "$sdk_version" '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)] | (map(select(.version == $v))[0] // sort_by(.version)[-1]) | .identifier')
        - 'echo "Using runtime: $runtime  (SDK: $sdk_version)"'
        - device_type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes | map(select(.productFamily=="iPhone")) | sort_by(.minRuntimeVersion) | .[-1].identifier' | tail -n1); xcrun simctl create "$devname" "$device_type"
        - sim_uuid=$(xcrun simctl list devices -je | jq -re '[.devices[][] | select(.name == "'$devname'").udid][0]')
        - xcrun simctl boot $sim_uuid
        - mkdir -p build/artifacts
        - echo $sim_uuid > ./build/artifacts/sim_uuid
        - echo $devname > ./build/artifacts/device_name
        - 'xcrun simctl list -je devices $sim_uuid | jq -r ''.devices[][0] | "\u001b[32;1mSimulator " + .state + ": \u001b[34m" + .name + " (\u001b[35m" + .deviceTypeIdentifier + ", \u001b[36m" + .udid + "\u001b[34m)\u001b[0m"'''
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Boot Test Simulator
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - /Users/$USER/sim-keepalive/keepalive.sh $(<./build/artifacts/sim_uuid)
      depends_on:
        - Boot Test Simulator
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: (Simulator keep-alive)
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - ./Scripts/build_ci.sh test -destination "platform=iOS Simulator,id=$(<./build/artifacts/sim_uuid)" -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 10 -collect-test-diagnostics never ENABLE_TESTABILITY=YES
      depends_on:
        - Reset SPM Cache if Needed
        - Clean up Old Test Simulators if Needed
        - Boot Test Simulator
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Build and Run Tests
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - echo "Signaling simulator keep-alive to stop and clean up..."
        - if [ -f build/artifacts/sim_uuid ]; then rm -f /Users/$USER/sim-keepalive/$(<./build/artifacts/sim_uuid); fi
      depends_on:
        - Build and Run Tests
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Stop Simulator Keep-Alive
      when:
        - status:
            - success
            - failure
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - echo "--- FAILED TESTS ---"
        - xcresultparser --output-format cli --failed-tests-only ./build/artifacts/testResults.xcresult
        - exit 1
      depends_on:
        - Build and Run Tests
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Log Failed Test Summary
      when:
        - status:
            - failure
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - xcresultparser --output-format cobertura ./build/artifacts/testResults.xcresult > ./build/artifacts/coverage.xml
      depends_on:
        - Build and Run Tests
      environment:
        DRONE_STAGE_ARCH: arm64
        DRONE_STAGE_OS: darwin
      image: sh
      name: Generate Code Coverage Report
      when:
        - status:
            - success
when:
    - event:
        - pull_request
        - tag
        - deployment
        - cron
        - manual

