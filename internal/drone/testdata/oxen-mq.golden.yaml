# Debian sid (amd64).yaml
clone:
    - image: docker.io/woodpeckerci/plugin-git:2
      name: clone
      settings:
        partial: false
        recursive: false
labels:
    backend: docker
    platform: linux/amd64
steps:
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - git fetch --tags
        - git submodule update --init --recursive --depth=1
      environment:
        CLICOLOR_FORCE: "1"
        DRONE_STAGE_ARCH: amd64
        DRONE_STAGE_OS: linux
      image: drone/git
      name: submodules
    - commands:
        - export DRONE_BRANCH="$CI_COMMIT_BRANCH" DRONE_BUILD_CREATED="$CI_PIPELINE_CREATED" DRONE_BUILD_EVENT="$CI_PIPELINE_EVENT" DRONE_BUILD_LINK="$CI_PIPELINE_URL" DRONE_BUILD_NUMBER="$CI_PIPELINE_NUMBER" DRONE_BUILD_PARENT="$CI_PIPELINE_PARENT" DRONE_BUILD_STARTED="$CI_PIPELINE_STARTED" DRONE_BUILD_STATUS="$CI_PIPELINE_STATUS" DRONE_COMMIT="$CI_COMMIT_SHA" DRONE_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" DRONE_COMMIT_AUTHOR_AVATAR="$CI_PIPELINE_AVATAR" DRONE_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" DRONE_COMMIT_AUTHOR_NAME="$CI_COMMIT_AUTHOR" DRONE_COMMIT_BEFORE="$CI_PREV_COMMIT_SHA" DRONE_COMMIT_BRANCH="$CI_COMMIT_BRANCH" DRONE_COMMIT_LINK="$CI_PIPELINE_FORGE_URL" DRONE_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" DRONE_COMMIT_REF="$CI_COMMIT_REF" DRONE_COMMIT_SHA="$CI_COMMIT_SHA" DRONE_GIT_HTTP_URL="$CI_REPO_CLONE_URL" DRONE_PULL_REQUEST="$CI_COMMIT_PULL_REQUEST" DRONE_REMOTE_URL="$CI_REPO_CLONE_URL" DRONE_REPO="$CI_REPO" DRONE_REPO_BRANCH="$CI_REPO_DEFAULT_BRANCH" DRONE_REPO_LINK="$CI_REPO_URL" DRONE_REPO_NAME="$CI_REPO_NAME" DRONE_REPO_OWNER="$CI_REPO_OWNER" DRONE_REPO_PRIVATE="$CI_REPO_PRIVATE" DRONE_REPO_SCM=git DRONE_SOURCE_BRANCH="$CI_COMMIT_SOURCE_BRANCH" DRONE_STAGE_MACHINE="$CI_MACHINE" DRONE_STEP_NUMBER="$CI_STEP_NUMBER" DRONE_SYSTEM_HOST="$CI_SYSTEM_HOST" DRONE_TAG="$CI_COMMIT_TAG" DRONE_TARGET_BRANCH="$CI_COMMIT_TARGET_BRANCH" DRONE_WORKSPACE="$CI_WORKSPACE"
        - echo "Building on $${CI_MACHINE}"
        - echo "man-db man-db/auto-update boolean false" | debconf-set-selections
        - apt-get -o=Dpkg::Use-Pty=0 -q update
        - apt-get -o=Dpkg::Use-Pty=0 -q install -y eatmydata
        - eatmydata apt-get -o=Dpkg::Use-Pty=0 -q  install --no-install-recommends -y lsb-release
        - cp contrib/deb.session.foundation.gpg /etc/apt/trusted.gpg.d
        - echo deb http://deb.session.foundation sid main >/etc/apt/sources.list.d/session.list
        - eatmydata apt-get -o=Dpkg::Use-Pty=0 -q  update
        - eatmydata apt-get -o=Dpkg::Use-Pty=0 -q dist-upgrade -y
        - eatmydata apt-get -o=Dpkg::Use-Pty=0 -q install -y cmake git ninja-build pkg-config ccache g++ libsodium-dev libzmq3-dev liboxenc-dev
        - mkdir build
        - cd build
        - 'cmake .. -G Ninja -DCMAKE_COLOR_DIAGNOSTICS=ON -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=OFF -DOXENMQ_BUILD_TESTS=ON '
        - ninja -v
        - cd ..
        - cd build
        - ./tests/tests --colour-mode ansi
        - cd ..
      environment:
        CLICOLOR_FORCE: "1"
        DRONE_STAGE_ARCH: amd64
        DRONE_STAGE_OS: linux
      image: registry.oxen.rocks/debian-sid
      name: build
      pull: true
when:
    - event:
        - push
        - pull_request
        - tag
        - deployment
        - cron
        - manual

