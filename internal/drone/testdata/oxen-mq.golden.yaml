# MacOS (amd64) Release.yaml
labels:
    backend: local
    platform: darwin/amd64
steps:
    - commands:
        - git fetch --tags
        - git submodule update --init --recursive --depth=1
      environment:
        DRONE_STAGE_ARCH: amd64
        DRONE_STAGE_OS: darwin
      image: sh
      name: submodules
    - commands:
        - echo "Building on $${CI_MACHINE}"
        - export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
        - ulimit -n 1024
        - mkdir build
        - cd build
        - 'cmake .. -G Ninja -DCMAKE_COLOR_DIAGNOSTICS=ON -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=OFF -DOXENMQ_BUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache '
        - ninja -v
        - cd ..
        - cd build
        - ./tests/tests --colour-mode ansi
        - cd ..
      environment:
        DRONE_STAGE_ARCH: amd64
        DRONE_STAGE_OS: darwin
        SSH_KEY:
            from_secret: SSH_KEY
      image: sh
      name: build
when:
    - event:
        - push
        - pull_request
        - tag
        - deployment
        - cron
        - manual

